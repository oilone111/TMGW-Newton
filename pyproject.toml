[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmgw-sim"
version = "0.18.0"
description = "Threshold-aware multi-continuum graph warm starts for fully implicit fractured-reservoir simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Fang Ma"},
  {name = "Daiyin Yin"},
  {name = "Zhaokai Tang"},
  {name = "Kai Liu"},
  {name = "Chao Li"},
  {name = "Dongqi Wang"},
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = ["torch==2.8.0"]
ml-cpu = ["torch==2.8.0"]
ml-jax = ["jax[cpu]>=0.4.38"]
viz = ["matplotlib>=3.8", "pandas>=2.1"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
